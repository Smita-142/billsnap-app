<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0e13" />
    <title>Bill Snap — Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; color: #f4f4f8; background: #0c0e13; font: 16px/1.6 system-ui, sans-serif; text-align: center; }
      main { max-width: 380px; }
      img { width: 68px; height: 68px; margin-bottom: 14px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0 0 20px; color: #a1a5b2; font-size: 14px; }
      a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 18px; border-radius: 9px; color: #17131e; background: #c1afff; font-size: 14px; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-icon.svg" alt="" />
      <h1>You’re offline for now.</h1>
      <p>Reconnect to load Bill Snap. Your locally saved demo bills remain on this device. Image analysis and connected AI services need an internet connection.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
